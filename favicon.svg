<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0D1228"/>
  <!-- Outer diamond -->
  <polygon points="16,3 29,16 16,29 3,16" fill="none" stroke="#BF5FFF" stroke-width="1.5"/>
  <!-- Inner diamond fill -->
  <polygon points="16,9 23,16 16,23 9,16" fill="#BF5FFF" opacity="0.18"/>
  <!-- Inner diamond stroke -->
  <polygon points="16,9 23,16 16,23 9,16" fill="none" stroke="#BF5FFF" stroke-width="0.7" opacity="0.5"/>
  <!-- Cross lines -->
  <line x1="3" y1="16" x2="29" y2="16" stroke="#BF5FFF" stroke-width="0.5" opacity="0.35"/>
  <line x1="16" y1="3" x2="16" y2="29" stroke="#BF5FFF" stroke-width="0.5" opacity="0.35"/>
  <!-- Cyan accent center -->
  <circle cx="16" cy="16" r="2.2" fill="#00F0FF" opacity="0.9"/>
  <circle cx="16" cy="16" r="3.5" fill="none" stroke="#00F0FF" stroke-width="0.6" opacity="0.3"/>
</svg>
