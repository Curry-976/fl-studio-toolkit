<svg width="280" height="70" viewBox="0 0 280 70" xmlns="http://www.w3.org/2000/svg">
  <!-- mayanabeat-logo.svg -->
  <rect width="280" height="70" fill="#03050D"/>
  <!-- Losange ◈ -->
  <g transform="translate(20,35)">
    <polygon points="0,-11 11,0 0,11 -11,0" fill="none" stroke="#BF5FFF" stroke-width="1.2"/>
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#BF5FFF" opacity="0.25"/>
    <line x1="-11" y1="0" x2="11" y2="0" stroke="#BF5FFF" stroke-width="0.5" opacity="0.5"/>
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#BF5FFF" stroke-width="0.5" opacity="0.5"/>
  </g>
  <!-- Wordmark -->
  <text x="40" y="40" font-family="'Space Mono',monospace" font-size="22" font-weight="700" fill="#E8F0FF" letter-spacing="1">MAYANA</text>
  <text x="183" y="40" font-family="'Space Mono',monospace" font-size="22" font-weight="700" fill="#E8F0FF" letter-spacing="1">BEAT</text>
  <!-- Underscore accent -->
  <text x="250" y="40" font-family="'Space Mono',monospace" font-size="22" font-weight="700" fill="#00F0FF">_</text>
  <!-- Separator line -->
  <line x1="40" y1="47" x2="268" y2="47" stroke="#00F0FF" stroke-width="0.8" opacity="0.8"/>
  <!-- Metadata -->
  <text x="40" y="59" font-family="'Space Mono',monospace" font-size="7" fill="rgba(180,210,255,0.3)" letter-spacing="1.5">PLATFORM v1.0  ·  PROD MARKETPLACE</text>
</svg>
